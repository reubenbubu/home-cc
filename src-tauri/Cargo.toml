[package]
name = "home-cc"
version = "0.1.0"
description = "Desktop app for managing a home network"
authors = ["Jim"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows).
name = "home_cc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }

# Network scan and ping. ping-async needs no admin rights on Windows or Linux.
ping-async = "1.0.2"
netdev = "0.47.0"
dns-lookup = "4.0.2"

# SSH. The ring backend builds on Windows without extra tools (no NASM).
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
data-encoding = "2"
# Random numbers for making SSH keys. The same version russh already builds on.
rand = "0.10"

# Copy and paste in terminal tabs: the web view can't be relied on to read the
# clipboard. Text only, which leaves out the image libraries.
arboard = { version = "3", default-features = false }

# Proxmox API over HTTPS. rustls with the ring provider only (no aws-lc-rs,
# so no NASM or cmake on Windows); the certificate is pinned by hand in
# src/proxmox/pin.rs. hyper and hyper-util are already used by Tauri.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
ring = "0.17"

# Same versions netdev already uses on Linux, for reading the neighbour table.
[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
netlink-sys = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    # A job object, so this PC's stats script stops with whatever it started.
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Stopping this PC's stats script together with whatever it started (its process group).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Debug builds: keep line numbers for our own code only. Full debug info for
# every dependency makes the build folder several GB bigger for no gain.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
